<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Миссия: Я САМА!</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b3fe4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Я САМА!">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#7b3fe4; --violet-dk:#5c26bb;
  --magenta:#e94ecb;
  --gold:#ffc23c; --gold-dk:#ef8f14;
  --mint:#23c99d; --mint-dk:#12a37c;
  --coral:#ff5f7e; --coral-dk:#e03a5c;
  --ink:#3c2662; --ink-soft:#8878ad;
  --line:#ece2ff; --app:#fbf6ff;
  --r-card:22px; --r-panel:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  font-family:"Baloo 2",Nunito,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink);
  min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  background:
    radial-gradient(120% 90% at 12% 0%, #a06aff 0%, transparent 60%),
    radial-gradient(120% 90% at 90% 100%, #ff86d0 0%, transparent 58%),
    linear-gradient(160deg,#4a2288 0%,#6b3ac0 50%,#8b57d6 100%);
}

.tablet{
  width:min(1180px,100%);
  height:min(820px,calc(100svh - 28px));
  background:linear-gradient(180deg,#2a1250,#160a2e);
  border-radius:38px;padding:12px;
  box-shadow:0 40px 80px rgba(20,4,50,.55), inset 0 2px 0 rgba(255,255,255,.18);
  display:flex;
}
.screen{
  flex:1 1 auto;min-width:0;
  background:var(--app);border-radius:27px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}

/* ── шапка ── */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:12px;
  padding:12px 16px;
  background:linear-gradient(180deg,#ffffff,#f6edff);
  border-bottom:2px solid var(--line);
  position:relative;z-index:5;
}
.hero-chip{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.avatar{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;position:relative;
  background:linear-gradient(160deg,#ffd9ef,#c9a4ff);
  border:3px solid #fff;
  box-shadow:0 4px 0 rgba(123,63,228,.25),0 8px 18px rgba(123,63,228,.25);
}
.avatar svg{width:100%;height:100%;border-radius:50%;display:block}
.lvl{
  position:absolute;left:-6px;bottom:-6px;
  min-width:25px;height:25px;padding:0 5px;border-radius:13px;
  background:linear-gradient(180deg,var(--violet),var(--violet-dk));
  color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;box-shadow:0 3px 8px rgba(92,38,187,.4);
}
.hero-meta{min-width:0}
.hero-name{font-size:14px;font-weight:800;line-height:1.1}
.hero-rank{font-size:11px;font-weight:800;color:var(--ink-soft);margin-top:1px}
.xp{width:120px;height:10px;border-radius:99px;margin-top:5px;background:#eadcff;
    box-shadow:inset 0 2px 4px rgba(76,32,140,.18);overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,var(--gold-dk));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6);transition:width .5s cubic-bezier(.2,.9,.3,1)}

.purse{
  flex:0 0 auto;align-self:center;
  display:inline-flex;align-items:center;gap:7px;
  height:44px;padding:0 16px 0 10px;border-radius:99px;
  background:linear-gradient(180deg,#ffe9a8,#ffc23c);
  border:3px solid #c9750a;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(0,0,0,.12),
             0 5px 0 #a85c04,0 10px 18px rgba(239,143,20,.3);
  font-size:21px;font-weight:800;color:#6d3600;line-height:1;white-space:nowrap;
  text-shadow:0 2px 0 rgba(255,255,255,.5);
}
.purse.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.14) rotate(-2deg)}}

.brand{flex:0 1 auto;min-width:0;margin:0 auto;text-align:center;line-height:.92;user-select:none;white-space:nowrap;overflow:hidden}
.brand b{display:block;font-size:14px;font-weight:900;font-style:italic;letter-spacing:.5px;color:var(--magenta)}
.brand span{
  display:block;font-size:28px;font-weight:800;font-style:italic;letter-spacing:-.5px;
  background:linear-gradient(180deg,#a86bff,#7b3fe4 55%,#e94ecb);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 4px 6px rgba(123,63,228,.35));
}

.nav{display:flex;gap:8px;flex:0 0 auto}
.nav button{
  position:relative;width:48px;height:48px;flex:0 0 auto;cursor:pointer;
  border:3px solid #c4ade8;border-radius:16px;
  background:linear-gradient(180deg,#ffffff,#eee2ff);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.9),inset 0 -5px 0 rgba(92,38,187,.08),
             0 5px 0 #c4ade8,0 9px 14px rgba(92,38,187,.18);
  font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s;
}
.nav button:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 0 0 #c4ade8}
.nav button[aria-current="page"]{
  border-color:#4e1ea8;
  background:linear-gradient(180deg,#b98bff,#7b3fe4);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.15),
             0 5px 0 #4e1ea8,0 10px 20px rgba(123,63,228,.45);
}
.nav button:focus-visible,.btn:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}
.nav button{position:relative}
.dot{
  position:absolute;right:-4px;top:-4px;
  min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:linear-gradient(180deg,#ff8095,#e03a5c);
  border:2px solid #fff;box-shadow:0 2px 6px rgba(224,58,92,.5);
  color:#fff;font-size:11px;font-weight:800;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  animation:pend 1.6s ease-in-out infinite;
}
@keyframes pend{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ── рабочая область ── */
.stage{
  flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:14px;padding:14px;
}

.scene{
  position:relative;border-radius:var(--r-panel);overflow:hidden;
  background:linear-gradient(180deg,#fbf4ff,#f6ecff);
  border:3px solid #fff;
  box-shadow:0 10px 26px rgba(92,38,187,.18);
  display:flex;flex-direction:column;min-width:0;
}
.scene-svg{flex:1 1 auto;width:100%;height:100%;min-height:0;display:block}
.scene-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.avatar>img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.acc{
  position:absolute;z-index:3;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  line-height:1;
  filter:drop-shadow(0 2px 3px rgba(92,38,187,.4));
}
.acc img{width:100%;height:auto;display:block}
.pick{display:none}
.scene-tag{
  position:absolute;left:16px;top:14px;z-index:2;
  padding:9px 16px;border-radius:99px;
  background:rgba(255,255,255,.88);
  border:2px solid #fff;box-shadow:0 6px 14px rgba(92,38,187,.2);
  font-size:15px;font-weight:800;
}
.scene-say{
  position:absolute;right:14px;top:12px;z-index:2;max-width:50%;
  padding:12px 16px;border-radius:20px 20px 20px 6px;
  background:#fff;border:2px solid var(--line);
  box-shadow:0 8px 18px rgba(92,38,187,.18);
  font-size:14px;font-weight:800;line-height:1.35;
}

.panel{
  border-radius:var(--r-panel);
  background:linear-gradient(180deg,#ffffff,#faf4ff);
  border:3px solid #fff;
  box-shadow:0 10px 26px rgba(92,38,187,.18);
  display:flex;flex-direction:column;min-height:0;min-width:0;
}
.panel-head{flex:0 0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
.panel-head h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.panel-head p{font-size:13px;font-weight:800;color:var(--ink-soft);margin-left:auto;text-align:right}
.panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 16px 18px}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:#e2d3ff;border-radius:99px}
.sub-title{font-size:17px;font-weight:800;margin:2px 0 9px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.card{
  position:relative;background:#fff;border:2px solid var(--line);
  border-radius:var(--r-card);padding:12px;text-align:center;
  display:flex;flex-direction:column;gap:9px;
  box-shadow:0 5px 0 #efe6ff,0 10px 20px rgba(92,38,187,.10);
}
.card.done{opacity:.62}
.card.locked{opacity:.72}
.card.locked .thumb{filter:grayscale(.75)}
.streak{
  position:absolute;right:8px;top:8px;z-index:2;
  padding:3px 9px;border-radius:999px;
  background:linear-gradient(180deg,#ffd9a8,#ff9f43);
  border:2px solid #fff;box-shadow:0 3px 8px rgba(200,90,10,.28);
  font-size:12px;font-weight:800;color:#6d3600;white-space:nowrap;
}
.thumb{
  height:100px;border-radius:16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:50px;
  background:linear-gradient(180deg,#f6efff,#ffeaf7);
}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h2{font-size:15px;font-weight:800;line-height:1.2}
.price{
  display:inline-flex;align-items:center;gap:5px;align-self:center;
  padding:4px 12px;border-radius:99px;font-size:15px;font-weight:800;color:#7a3d00;
  background:linear-gradient(180deg,#fff2cd,#ffd980);border:2px solid #fff;
}
.btn{
  position:relative;width:100%;margin-top:auto;cursor:pointer;
  --c1:#b98bff; --c2:#7b3fe4; --c3:#4e1ea8;
  border:3px solid var(--c3);border-radius:18px;
  padding:12px 14px 13px;
  font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.2px;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 58%,var(--c2) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.55),
    inset 0 -6px 0 rgba(0,0,0,.14),
    0 6px 0 var(--c3),
    0 10px 18px rgba(60,20,120,.28);
  transition:transform .1s,box-shadow .1s,filter .15s;
}
.btn::after{
  content:"";position:absolute;left:3px;right:3px;top:0;height:48%;
  border-radius:14px 14px 40px 40px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));
}
.btn:hover{filter:brightness(1.06)}
.btn:active{
  transform:translateY(6px);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.14),0 0 0 var(--c3);
}
.btn.mint{--c1:#7cf0cf;--c2:#23c99d;--c3:#0c8465}
.btn.gold{--c1:#ffe6a3;--c2:#ffbe2e;--c3:#c9750a;color:#6d3600;text-shadow:0 2px 0 rgba(255,255,255,.45)}
.btn.coral{--c1:#ffa8ba;--c2:#ff5f7e;--c3:#c02845}
.btn.ghost{--c1:#ffffff;--c2:#efe4ff;--c3:#bda4e6;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.btn[disabled]{--c1:#e2d9f2;--c2:#c7bbdd;--c3:#a294c0;cursor:default;color:#fff;filter:saturate(.5)}
.btn[disabled]:active{transform:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(0,0,0,.1),0 6px 0 var(--c3)}

.ribbon{
  position:absolute;top:10px;right:-6px;z-index:2;
  padding:4px 10px;border-radius:8px 4px 4px 8px;
  font-size:11px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#ffb03c,var(--gold-dk));
  box-shadow:0 3px 8px rgba(239,143,20,.4);
}
.ribbon.mint{background:linear-gradient(180deg,#4ee0b6,var(--mint-dk))}

.add{border:3px dashed #c9a8ff;background:linear-gradient(180deg,#faf3ff,#f3e7ff);
  align-items:center;justify-content:center;cursor:pointer;min-height:180px;box-shadow:none}
.add .plus{font-size:44px;font-weight:800;color:var(--violet);line-height:1}

.empty{grid-column:1/-1;text-align:center;padding:34px 18px;
  border-radius:var(--r-card);border:2px dashed #dcc9ff;background:#fbf5ff}
.empty .big{font-size:44px}
.empty h2{font-size:17px;font-weight:800;margin:8px 0 4px}
.empty p{font-size:13px;font-weight:700;color:var(--ink-soft)}

.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.badge{display:flex;gap:12px;align-items:center;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:var(--r-card);padding:12px;
  box-shadow:0 5px 0 #efe6ff}
.badge .medal{width:54px;height:54px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:27px;
  background:linear-gradient(180deg,#efe6ff,#ded0f7);filter:grayscale(1);opacity:.55}
.badge.on .medal{background:linear-gradient(180deg,#ffe08a,var(--gold));filter:none;opacity:1;
  box-shadow:0 4px 0 var(--gold-dk),0 0 22px rgba(255,194,60,.6)}
.badge h3{font-size:14px;font-weight:800}
.badge p{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;
  box-shadow:0 5px 0 #efe6ff}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1}
.stat span{font-size:11px;font-weight:800;color:var(--ink-soft)}

.goal{background:linear-gradient(135deg,#7b3fe4,#e94ecb);color:#fff;
  border-radius:var(--r-card);padding:16px;margin-bottom:14px;
  box-shadow:0 8px 20px rgba(123,63,228,.35)}
.goal.calm{background:linear-gradient(135deg,#23c99d,#1a9ecf);box-shadow:0 8px 20px rgba(26,158,207,.3)}
.goal h3{font-size:17px;font-weight:800}
.goal p{font-size:13px;font-weight:800;opacity:.92;margin-top:4px}
.goal .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:12px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:linear-gradient(180deg,#fff3c9,var(--gold));border-radius:99px;transition:width .5s}

.line{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:10px 12px;margin-bottom:9px;box-shadow:0 4px 0 #efe6ff}
.line .ic{font-size:25px;flex:0 0 auto}
.line b{font-size:14px;font-weight:800}
.line small{display:block;font-size:12px;font-weight:800;color:var(--ink-soft)}
.line .tail{margin-left:auto;font-size:15px;font-weight:800;color:var(--gold-dk);white-space:nowrap}
.kill{border:none;background:#ffe9ee;color:var(--coral-dk);margin-left:8px;
  width:34px;height:34px;border-radius:12px;font-size:17px;cursor:pointer;font-weight:800;flex:0 0 auto}
.divider{height:2px;background:var(--line);border-radius:2px;margin:14px 0}

.sheet{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(40,14,80,.5)}
.sheet.open{display:flex}
.sheet-box{width:min(440px,100%);max-height:100%;overflow-y:auto;
  background:var(--app);border-radius:28px;padding:20px;
  border:3px solid #fff;box-shadow:0 30px 60px rgba(30,8,70,.45);
  display:flex;flex-direction:column;gap:11px;animation:rise .28s cubic-bezier(.2,1.1,.4,1)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.sheet-box h2{font-size:21px;font-weight:800}
.sheet-box label{font-size:12px;font-weight:900;color:var(--ink-soft);margin-bottom:-5px}
.sheet-box input,.sheet-box select{font-family:inherit;font-size:16px;font-weight:800;color:var(--ink);
  padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;width:100%}
.sheet-box input:focus,.sheet-box select:focus{outline:none;border-color:var(--violet)}
.sheet-box select{
  -webkit-appearance:none;appearance:none;cursor:pointer;
  padding-right:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--violet) 50%),
                   linear-gradient(135deg,var(--violet) 50%,transparent 50%);
  background-position:calc(100% - 22px) 22px,calc(100% - 15px) 22px;
  background-size:7px 7px,7px 7px;background-repeat:no-repeat;
}
.sheet-box select option{font-weight:700}
.hint{font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.45}
.vrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.vrow>span{flex:0 0 86px;font-size:12px;font-weight:900;color:var(--ink-soft)}
.vrow select{flex:1 1 auto;min-width:0;font-family:inherit;font-size:14px;font-weight:800;color:var(--ink);
  padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.vrow input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--violet);height:24px}

.toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,26px);
  z-index:80;opacity:0;pointer-events:none;max-width:80%;text-align:center;
  padding:13px 22px;border-radius:99px;
  background:linear-gradient(180deg,#5c26bb,#3c1580);color:#fff;
  font-size:15px;font-weight:800;box-shadow:0 14px 30px rgba(30,8,70,.45);
  transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.det-thumb{width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:64px;
  background:linear-gradient(180deg,#f6efff,#ffeaf7);border:2px solid var(--line)}
.det-thumb img{width:100%;height:100%;object-fit:cover}
.det-desc{font-size:15px;font-weight:500;color:#5b4a7d;line-height:1.5}
.det-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.det-meta .btn{width:auto;margin:0;flex:1 1 auto}
.tap{cursor:pointer}
.spark{position:absolute;z-index:70;pointer-events:none;font-size:26px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── телефон / узкий экран ── */
@media (max-width:900px){
  body{padding:0;display:block}
  .tablet{width:100%;height:100svh;border-radius:0;padding:0;box-shadow:none}
  /* вырез камеры сверху и полоса жестов снизу на iPhone */
  .topbar{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .stage{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .sheet-box{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .screen{border-radius:0}
  .topbar{gap:10px;padding:10px 12px}
  .hero-chip{order:1}
  .purse{order:2;margin-left:auto;height:40px;font-size:19px;padding:0 14px 0 9px}
  .brand{order:3;flex:0 0 100%;margin:0;text-align:left}
  .brand b{display:inline;font-size:12px}
  .brand span{display:inline;font-size:20px;margin-left:6px}
  .nav{order:4;width:100%;justify-content:space-between;gap:6px}
  .nav button{flex:1 1 0;width:auto;height:44px;font-size:20px;border-radius:14px}
  .xp{width:110px}
  .stage{display:block;padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scene{margin-bottom:10px}
  .scene-svg{flex:none;height:auto;aspect-ratio:520/400}
  .panel-body{overflow:visible}
  .scene-say{display:none}
  .grid,.badges{grid-template-columns:1fr}
  .thumb{height:96px}
}
@media (max-width:360px){
  .hero-name,.hero-rank{font-size:11px}

(function(){

    if(!list)return;

      if(list[i].img)continue;
      for(var j=0;j<seed.length;j++){
        if(seed[j].t===list[i].title&&seed[j].p){list[i].img=seed[j].p;break}

      if(!list[i].img)list[i].img=pickPic(list[i].title);
      /* Старые сохранения не знают про серии — проставляем требование по названию. */
      if(list[i].days===undefined){

        for(var k=0;k<seed.length;k++){

    }

function shrink(file,maxSide,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,maxSide/Math.max(im.width,im.height));
      var c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=function(){say('Не получилось открыть файл')};
    im.src=fr.result;
  };
  fr.onerror=function(){say('Не получилось прочитать файл')};
  fr.readAsDataURL(file);
}

/* ── Голос героини ───────────────────────────────────────────────
   Читает реплики синтезом речи, встроенным в систему. Если позже
   положить записи в папку audio (scene-home.mp3, task-bed.mp3 и т.д.),

var PIN=String(Store.get('ys_pin','1234'));

var VNAME=Store.get('ys_vname','');    /* выбранный голос, у каждого устройства свой набор */
var ruList=[];

function pickVoice(){
  try{
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    ruList=vs.filter(function(v){return /^ru/i.test(v.lang||'')});
    if(VNAME){
      var saved=ruList.filter(function(v){return v.name===VNAME})[0];
      if(saved){ruVoice=saved;return}
    }
    /* Лучшие женские русские голоса: Milena на Apple, Irina на Windows, Google на Android. */
    var best=/milena|irina|svetlana|dariya|alena|katya|tatyana|google/i;
    ruVoice=ruList.filter(function(v){return best.test(v.name||'')})[0]||ruList[0]||null;
  }catch(e){ruVoice=null}
}
if(window.speechSynthesis){
  pickVoice();
  try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
}

function tts(text){
  if(!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ru-RU';
    u.pitch=PITCH;
    u.rate=RATE;
    if(ruVoice)u.voice=ruVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

function playVoice(text,key){
  if(key){
    var src='audio/'+key+'.mp3';
    if(!missing[src]){
      try{
        var a=new Audio(src), fell=false;
        /* Ошибка приходит двумя путями — читаем вслух только один раз. */
        var fallback=function(){if(fell)return;fell=true;missing[src]=true;tts(text)};
        a.onerror=fallback;
        var pr=a.play();
        if(pr&&pr.catch)pr.catch(fallback);
        return;
      }catch(e){missing[src]=true}
    }
  }
  tts(text);
}

function speak(text,key){
  if(!VOICE||!text)return;
  /* iOS не разрешает говорить до первого касания — придержим фразу. */
  if(!voiceReady){pending={t:text,k:key};return}
  playVoice(text,key);
}

function unlockVoice(){
  if(voiceReady)return;
  voiceReady=true;
  pickVoice();
  if(pending){playVoice(pending.t,pending.k);pending=null}
}
document.addEventListener('pointerdown',unlockVoice);
document.addEventListener('keydown',unlockVoice);

    s.className='spark';s.textContent='⭐';
    s.style.left=(r.left-box.left+r.width/2)+'px';
    s.style.top=(r.top-box.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*220-110)+'px');
    s.style.setProperty('--dy',(-70-Math.random()*130)+'px');
    s.style.setProperty('--rot',(Math.random()*360-180)+'deg');
    screen.appendChild(s);
    (function(node){setTimeout(function(){node.remove()},950)})(s);
  }
}

var SCENE={
  home:['Моя комната','Я сегодня всё сделаю сама!'],
  tasks:['Мои миссии','Выбирай задание — и вперёд!'],
  shop:['Магазин наград','Копим звёзды на что-то классное'],
  wear:['Гардероб','Что наденем сегодня?'],
  awards:['Мои награды','Смотри, сколько я уже смогла!'],

};

function go(p){
  page=p;
  var btns=document.querySelectorAll('.nav button');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('data-go')===p)btns[i].setAttribute('aria-current','page');
    else btns[i].removeAttribute('aria-current');
  }
  $('#sceneTag').textContent=SCENE[p][0];
  $('#sceneSay').textContent=SCENE[p][1];
  speak(SCENE[p][1],'scene-'+p);
  applyScene();
  render();
}

function render(){
  var body=$('#pageBody'),note=$('#pageNote');

  $('#pageTitle').textContent=titles[page];
  paintHeader();

  if(page==='home'){
    var toLvl=STEP-(S.earned%STEP);
    var sorted=S.rewards.slice().sort(function(a,b){return a.value-b.value});
    var next=null;
    for(var i=0;i<sorted.length;i++){if(sorted[i].value>S.stars){next=sorted[i];break}}
    if(!next)next=sorted[sorted.length-1]||null;
    var todo=S.tasks.filter(function(t){return t.status==='new'});
    note.textContent='Уровень '+level();

      '<div class="stat"><b>'+S.done+'</b><span>дел сделано</span></div>'+

      var pct=Math.min(100,Math.round(S.stars/next.value*100));
      html+='<div class="goal"><h3>'+(next.icon||'🎁')+' Ближайшая цель: '+esc(next.title)+'</h3>'+
        '<p>'+(S.stars>=next.value?'Хватает! Загляни в магазин наград':'Осталось накопить '+(next.value-S.stars)+' ⭐')+'</p>'+

      html+='<div class="empty"><div class="big">🎉</div><h2>Все дела сделаны</h2><p>До следующего дня можно отдыхать</p></div>';

    body.innerHTML=html;
    body.querySelectorAll('[data-info]').forEach(function(b){

    });
    if($('#goTasks'))$('#goTasks').onclick=function(){go('tasks')};
    return;
  }

  if(page==='tasks'){
    var left=S.tasks.filter(function(t){return t.status!=='completed'}).length;

    var inner='';
    if(S.tasks.length===0){
      inner='<div class="empty"><div class="big">📋</div><h2>Заданий пока нет</h2><p>Попроси маму или папу открыть раздел «Родителям» и добавить первое дело</p></div>';

  if(page==='shop'){
    note.textContent='У тебя '+S.stars+' ⭐ · серия '+days(S.streak);

      {i:'🌱',n:'Первый шаг',d:'Выполнить первое дело',ok:S.done>=1},

      return '<div class="line"><span class="ic">'+(r.icon||'🎁')+'</span>'+
        '<div><b>'+esc(r.title)+'</b><small>в магазине</small></div>'+
        '<span class="tail">'+r.value+' ⭐</span>'+
        '<button class="kill" data-delr="'+i+'" aria-label="Удалить">✕</button></div>';
    }).join(''):'<p class="hint">Наград пока нет. Нажмите «Добавить награду» — в списке есть готовые, с картинками и условиями по дням.</p>';
    h+='<div class="divider"></div>'+
      '<button class="btn ghost" id="newDay">Начать новый день</button><div style="height:8px"></div>'+
      '<button class="btn ghost" id="pinChange">Сменить PIN</button><div style="height:8px"></div>'+
      '<button class="btn coral" id="wipe">Сбросить всю игру</button><div style="height:10px"></div>'+
      '<p class="hint">«Новый день» вернёт выполненные дела в список. Звёзды и награды останутся.</p>'+
      '<div class="divider"></div>'+
      '<button class="btn mint" id="parentOff">Выйти из режима родителя</button>'+
      '<p class="hint" style="margin-top:8px">Пока режим включён, звёзды можно засчитывать без PIN. Выходите, отдавая устройство ребёнку.</p>';

      b.onclick=function(){S.rewards.splice(+b.getAttribute('data-delr'),1);save();render()};

      if(S.streak>S.best)S.best=S.streak;
      S.tasks.forEach(function(t){t.status='new'});
      save();render();
      say(all?('День засчитан! Серия: '+days(S.streak))
             :'Новый день начался. Серия обнулилась — не все дела были сделаны');

function taskSheet(i){
  var t=S.tasks[i];
  if(!t)return;
  var thumb=pic(t.img,t.icon||'🎯');
  var act;
  if(t.status==='completed')act='<button class="btn" disabled>Уже сделано</button>';
  else if(t.status==='pending')act=parentOn
    ?'<button class="btn mint" id="dOk">Засчитать +'+t.value+' ⭐</button>'
    :'<button class="btn" disabled>Ждём проверки ⏳</button>';
  else act='<button class="btn" id="dDo">Я сделала!</button>';
  openSheet('<div class="det-thumb">'+thumb+'</div>'+
    '<h2>'+esc(t.title)+'</h2>'+
    '<p class="det-desc">'+(t.desc?esc(t.desc):'Сделай это дело — и получишь звёзды.')+'</p>'+
    '<div class="det-meta"><span class="price">+'+t.value+' ⭐</span>'+act+'</div>'+
    '<button class="btn ghost" id="dNo">Закрыть</button>');
  speak(t.title+'. '+(t.desc||'Сделай это дело — и получишь звёзды.'),
        t.img?t.img.replace(/^img\//,'').replace(/\.\w+$/,''):null);
  $('#dNo').onclick=closeSheet;
  if($('#dDo'))$('#dDo').onclick=function(){
    t.status='pending';save();closeSheet();render();say('Отправила маме на проверку ⏳');
  };
  if($('#dOk'))$('#dOk').onclick=function(){
    if(!parentOn){say('Сначала войдите в режим родителя');return}
    t.status='completed';S.stars+=t.value;S.earned+=t.value;S.done++;
    save();closeSheet();paintHeader(true);render();say('+'+t.value+' ⭐ засчитано!');
  };
}

function openSheet(html){$('#sheetBox').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#sheet').onclick=function(e){if(e.target.id==='sheet')closeSheet()};

function askPin(){
  openSheet('<h2>🔒 Родительский режим</h2>'+
    '<p class="hint">Введите PIN, чтобы добавлять дела, засчитывать звёзды и настраивать награды.</p>'+
    '<input type="password" inputmode="numeric" id="pin" placeholder="'+(PIN==='1234'?'PIN по умолчанию 1234':'Введите PIN')+'" autocomplete="off">'+
    '<button class="btn" id="pinOk">Войти</button>'+
    '<button class="btn ghost" id="pinNo">Отмена</button>');
  function enter(){
    if($('#pin').value.trim()!==PIN){say('PIN не подошёл');return}
    parentOn=true;closeSheet();go('parent');say('Режим родителя включён');
  }
  $('#pinOk').onclick=enter;
  $('#pinNo').onclick=closeSheet;
  $('#pin').onkeydown=function(e){if(e.key==='Enter')enter()};
  setTimeout(function(){$('#pin').focus()},60);
}

function pinSheet(){
  openSheet('<h2>🔒 Смена PIN</h2>'+
    '<p class="hint">Четыре цифры. Понадобится, чтобы входить в режим родителя.</p>'+
    '<label>Текущий PIN</label>'+
    '<input type="password" inputmode="numeric" id="p0" autocomplete="off">'+
    '<label>Новый PIN</label>'+
    '<input type="password" inputmode="numeric" id="p1" autocomplete="off">'+
    '<label>Новый PIN ещё раз</label>'+
    '<input type="password" inputmode="numeric" id="p2" autocomplete="off">'+
    '<button class="btn mint" id="pSave">Сохранить</button>'+
    '<button class="btn ghost" id="pNo">Отмена</button>');
  $('#pNo').onclick=closeSheet;
  $('#pSave').onclick=function(){
    var cur=$('#p0').value.trim(), a=$('#p1').value.trim(), b=$('#p2').value.trim();
    if(cur!==PIN){say('Текущий PIN не подошёл');return}
    if(!/^\d{4}$/.test(a)){say('Новый PIN — ровно четыре цифры');return}
    if(a!==b){say('Новые PIN не совпали');return}
    PIN=a;Store.set('ys_pin',PIN);closeSheet();say('PIN изменён');
  };
  setTimeout(function(){$('#p0').focus()},60);
}

function editSheet(kind){
  var isTask=kind==='task';
  var cat=isTask?CAT_TASKS:CAT_REWARDS;
  /* Показываем весь каталог. Уже добавленное помечаем, но не убираем —
     одно и то же дело может понадобиться дважды. */
  var have={};
  (isTask?S.tasks:S.rewards).forEach(function(x){have[x.title]=1});
  var opts='<option value="">— выберите из готовых —</option>';
  cat.forEach(function(c,i){
    opts+='<option value="'+i+'">'+c.i+'  '+esc(c.t)+(have[c.t]?'  (уже добавлено)':'')+'</option>';
  });
  opts+='<option value="own">✏️  Своё '+(isTask?'дело':'награда')+'…</option>';

  openSheet('<h2>'+(isTask?'📋 Новое дело':'🎁 Новая награда')+'</h2>'+
    '<label>Готовые '+(isTask?'дела':'награды')+' — с картинками</label>'+
    '<select id="fPick">'+opts+'</select>'+
    '<p class="hint">Выберите из списка — название, значок и картинка подставятся сами. Или «Своё», чтобы вписать вручную.</p>'+
    '<label>Название</label>'+
    '<input id="fTitle" placeholder="'+(isTask?'Например: убрать со стола':'Например: поход в кино')+'">'+
    '<label>'+(isTask?'Сколько звёзд за выполнение':'Цена в звёздах')+'</label>'+
    '<input id="fVal" type="number" min="1" value="'+(isTask?20:500)+'">'+
    (isTask?'<label>Описание — что именно нужно сделать</label>'+
      '<input id="fDesc" placeholder="Необязательно: пара фраз для ребёнка">'
      :'<label>Открыть после скольких дней подряд</label>'+
       '<input id="fDays" type="number" min="0" value="0">'+
       '<p class="hint">0 — доступна сразу, как мороженое. Больше нуля — откроется, только когда все дела закрыты столько дней подряд, и покупка обнулит серию.</p>')+
    '<label>Значок или картинка</label>'+
    '<input id="fImg" placeholder="Необязательно: 🐱, img/файл.jpg или https://...">'+
    '<p class="hint">Оставьте пустым — картинка подберётся по названию. «Помыть посуду», «вынести мусор», «собрать портфель» и другие привычные дела игра узнаёт сама.</p>'+
    '<button class="btn mint" id="fSave">Сохранить</button>'+
    '<button class="btn ghost" id="fNo">Отмена</button>');
  $('#fNo').onclick=closeSheet;

  var chosen=null;
  $('#fPick').onchange=function(){
    var val=this.value;
    if(val==='own'||val===''){
      /* Сняли выбор — очищаем всё, что подставилось из каталога. */
      chosen=null;
      $('#fTitle').value='';
      $('#fImg').value='';
      $('#fVal').value=isTask?20:200;
      if(isTask&&$('#fDesc'))$('#fDesc').value='';
      if(!isTask&&$('#fDays'))$('#fDays').value=0;
      if(val==='own')$('#fTitle').focus();
      return;
    }
    chosen=cat[+val];
    $('#fTitle').value=chosen.t;
    $('#fVal').value=chosen.v;
    $('#fImg').value=chosen.p;
    if(isTask&&$('#fDesc'))$('#fDesc').value=chosen.d||'';
    if(!isTask&&$('#fDays'))$('#fDays').value=chosen.n||0;
  };

  $('#fSave').onclick=function(){
    var title=$('#fTitle').value.trim(),v=parseInt($('#fVal').value,10),img=$('#fImg').value.trim();
    if(!title){say('Впишите название');return}
    if(!v||v<1){say('Укажите количество звёзд');return}
    var item={title:title,value:v,icon:pickIcon(title),img:pickPic(title)};
    if(isTask&&$('#fDesc'))item.desc=$('#fDesc').value.trim();
    if(/^(https?:|\.?\/|img\/)/.test(img))item.img=img;
    else if(img&&img.length<=4)item.icon=img;
    if(isTask){item.status='new';S.tasks.push(item)}
    else{item.days=Math.max(0,parseInt($('#fDays').value,10)||0);S.rewards.push(item)}
    save();closeSheet();render();say(isTask?'Дело добавлено':'Награда в магазине');
  };
  setTimeout(function(){$('#fTitle').focus()},60);
}

function wishSheet(){
  openSheet('<h2>💭 Моя мечта</h2>'+
    '<p class="hint">Напиши, что тебе хочется. Родители посмотрят и назначат цену в звёздах.</p>'+
    '<input id="wTitle" placeholder="Например: набор для рисования">'+
    '<input id="wVal" type="number" min="1" placeholder="Сколько звёзд, по-твоему?">'+
    '<button class="btn gold" id="wSave">Добавить в магазин</button>'+
    '<button class="btn ghost" id="wNo">Отмена</button>');
  $('#wNo').onclick=closeSheet;
  $('#wSave').onclick=function(){
    var t=$('#wTitle').value.trim(),v=parseInt($('#wVal').value,10)||500;
    if(!t){say('Впиши название');return}
    S.rewards.push({title:t,value:v,icon:pickIcon(t),img:pickPic(t)});
    save();closeSheet();render();say('Мечта добавлена в магазин ✨');
  };
  setTimeout(function(){$('#wTitle').focus()},60);
}

function confirmSheet(){
  openSheet('<h2>⚠️ Сбросить игру</h2>'+
    '<p class="hint">Удалятся звёзды, уровень, все дела и награды. Отменить это будет нельзя.</p>'+
    '<button class="btn coral" id="cYes">Да, сбросить всё</button>'+
    '<button class="btn ghost" id="cNo">Оставить как есть</button>');
  $('#cNo').onclick=closeSheet;
  $('#cYes').onclick=function(){Store.wipe();location.reload()};
}

document.querySelectorAll('.nav button').forEach(function(b){
  var target=b.getAttribute('data-go');
  if(!target)return;
  b.onclick=function(){
    if(target==='parent'&&!parentOn){askPin();return}
    go(target);
  };
});

$('#voiceBtn').onclick=function(){
  VOICE=VOICE?0:1;
  Store.set('ys_voice',VOICE);
  paintVoice();
  if(VOICE){voiceReady=true;speak(SCENE[page][1],'scene-'+page)}
  else if(window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}
  say(VOICE?'Голос включён':'Голос выключен');
};

/* Нажатие на реплику героини — повторить её вслух. */
$('#sceneSay').onclick=function(){speak(SCENE[page][1],'scene-'+page)};
$('#sceneSay').style.cursor='pointer';

applyPics();
paintVoice();
go('home');

/* Установка приложения на Android и Windows.
   Браузер сам решает, когда предложить — ловим это событие и показываем кнопку.
   На iPhone события нет: там ставят вручную через «Поделиться» → «На экран Домой». */
var installEvent=null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  installEvent=e;
  var b=$('#installBtn');
  if(b)b.hidden=false;
});
if($('#installBtn')){
  $('#installBtn').onclick=function(){
    if(!installEvent){say('Браузер пока не предлагает установку');return}
    installEvent.prompt();
    installEvent.userChoice.then(function(r){
      installEvent=null;
      $('#installBtn').hidden=true;
      say(r&&r.outcome==='accepted'?'Игра установлена!':'Установку можно запустить позже из меню браузера');
    });
  };
}
window.addEventListener('appinstalled', function(){
  installEvent=null;
  var b=$('#installBtn'); if(b)b.hidden=true;
});

/* Офлайн-режим. Работает только по https — на GitHub Pages включится сам,
   при открытии файла с диска просто ничего не делает. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
